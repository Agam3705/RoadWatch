<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="rwShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rwRoad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="rwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#rwShield)" />
  <rect x="4" y="4" width="56" height="56" rx="16" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Road Surface Perspective (Highway converging upwards) -->
  <path d="M16 52 L26 22 L38 22 L48 52 Z" fill="#0f172a" fill-opacity="0.85" />

  <!-- Road Boundary Lines -->
  <path d="M16 52 L26 22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M48 52 L38 22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Dashed Center Divider -->
  <line x1="32" y1="25" x2="32" y2="31" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="36" x2="32" y2="43" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="47" x2="32" y2="52" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

  <!-- AI Radar Eye / Geotag Pin at the Zenith -->
  <circle cx="32" cy="17" r="5.5" fill="#f59e0b" filter="url(#rwGlow)" />
  <circle cx="32" cy="17" r="2.5" fill="#ffffff" />
  <circle cx="32" cy="17" r="8.5" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="2 2" />
</svg>
