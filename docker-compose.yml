services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:8.0
    container_name: roadwatch-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=roadwatch_db

  # 2. Redis Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: roadwatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # 3. FastAPI AI Computer Vision Service
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: roadwatch-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  # 4. Django REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadwatch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/media
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=roadwatch-docker-dev-secret-key-2026
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=*
      - MONGODB_URI=mongodb://mongodb:27017/
      - MONGODB_DATABASE=roadwatch_db
      - MEDIA_ROOT=/app/media
      - AI_SERVICE_URL=http://ai_service:8001
    depends_on:
      - mongodb
      - ai_service
      - redis

  # 5. React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roadwatch-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
